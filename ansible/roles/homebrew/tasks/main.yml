---
- name: Locate Homebrew binary (macOS)
  when: ansible_facts['os_family'] == "Darwin"
  ansible.builtin.stat:
    path: /opt/homebrew/bin/brew
  register: brew_arm_bin

- name: Set Homebrew prefix fact (macOS)
  when: ansible_facts['os_family'] == "Darwin"
  ansible.builtin.set_fact:
    homebrew_prefix: "{{ '/opt/homebrew' if brew_arm_bin.stat.exists else '/usr/local' }}"

- name: Install Homebrew (macOS)
  when: ansible_facts['os_family'] == "Darwin" and not brew_arm_bin.stat.exists
  ansible.builtin.shell:
    cmd: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  environment:
    NONINTERACTIVE: "1"

- name: Install Xcode Command Line Tools (macOS)
  when: ansible_facts['os_family'] == "Darwin"
  ansible.builtin.command:
    cmd: xcode-select --install
  register: xcode_cli
  failed_when: false
  changed_when: "'already installed' not in (xcode_cli.stderr | default(''))"

- name: Tap hashicorp/tap (macOS)
  when: ansible_facts['os_family'] == "Darwin"
  community.general.homebrew_tap:
    name: hashicorp/tap
    state: present
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_env.PATH }}"
