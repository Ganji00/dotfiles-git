---
- name: Install core packages (Arch)
  become: true
  when: ansible_facts['os_family'] == "Archlinux"
  community.general.pacman:
    name:
      - git
      - neovim
      - alacritty
      - rofi
      - thunar
      - dunst
      - picom
      - flameshot
      - arandr
      - tree
      - eza
      - tldr
      - thefuck
      - xclip
      - alsa-utils
      - sl
      - nftables
      - base-devel
      - ripgrep
      - tmux
      - lazygit
      - docker
      - docker-buildx
      - kubectl
      - kubectx
      - terraform
    state: present

# --- macOS ---
# rofi, thunar, dunst, picom, arandr, xclip, alsa-utils, nftables are
# X11/Linux-only with no macOS equivalent, skipped here on purpose.

- name: Install core packages (macOS)
  when: ansible_facts['os_family'] == "Darwin"
  community.general.homebrew:
    name:
      - git
      - neovim
      - tree
      - eza
      - tldr
      - ripgrep
      - tmux
      - lazygit
      - kubectl
      - kubectx
      - hashicorp/tap/terraform
      - sl
    state: present
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_env.PATH }}"

- name: Install core casks (macOS)
  when: ansible_facts['os_family'] == "Darwin"
  community.general.homebrew_cask:
    name:
      - alacritty
      - docker
    state: present
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_env.PATH }}"
